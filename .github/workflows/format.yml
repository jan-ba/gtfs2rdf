name: clang-format

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 || sudo apt-get install -y clang-format

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail

          # prefer clang-format-18, fall back to clang-format
          CF=clang-format-18
          command -v "$CF" >/dev/null 2>&1 || CF=clang-format

          files=$(git ls-files 'src/**' 'tests/**' \
            | grep -Ev '^src/third_party/' \
            | grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|ipp|inl|ixx|cppm)$' || true)

          [ -z "$files" ] && exit 0

          echo "$files" | xargs -r "$CF" -i --style=file

          # fail if clang-format changed anything
          git diff --exit-code
